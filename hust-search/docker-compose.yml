services:
  lucene:
    build: .
    volumes:
      - lucene-index:/index          # index nằm ở volume, xoá container không mất
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  # Hai instance Lucene riêng cho api/so_sanh.py (so bóc cũ với bóc mới). Chỉ bật khi cần:
  #   docker compose --profile compare up -d --build lucene-cu lucene-moi
  # Index nằm ở volume riêng, không đụng index chính ở cổng 8081.
  lucene-cu: &lucene-so-sanh
    profiles: ["compare"]
    build: .
    volumes: ["lucene-cu:/index"]
    ports: ["8091:8081"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
  lucene-moi:
    <<: *lucene-so-sanh
    volumes: ["lucene-moi:/index"]
    ports: ["8092:8081"]

  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db          # kết quả bóc tách; xoá container không mất
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    # không mở cổng ra host: stack chưa có xác thực (README mục 10)

  api:
    build: ./api
    depends_on:
      lucene: {condition: service_healthy}
      mongo: {condition: service_healthy}
    volumes:
      - ../hust-crawler:/crawler     # dùng chung code và kho với crawler đang có
      - ./api:/app                   # sửa API hoặc giao diện không phải build lại image
    ports: ["8000:8000"]
    environment:
      LUCENE_URL: http://lucene:8081
      MONGO_URL: mongodb://mongo:27017

volumes:
  lucene-index:
  mongo-data:
  lucene-cu:
  lucene-moi:
